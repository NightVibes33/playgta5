name: GTAiOS
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
targets:
  GTAiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: WebRuntime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.gtaios
        PRODUCT_NAME: GTAiOS
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "$(SRCROOT)/Config/Info.plist"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  GTAiOS:
    build:
      targets:
        GTAiOS: all
    run:
      config: Debug
    archive:
      config: Release
