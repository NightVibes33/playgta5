name: GTAiOS
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "18.5"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.5"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
targets:
  GTAiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Engine/RuntimeDiagnostics.swift
          - Storage/AssetHTTPServer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.gtaios
        PRODUCT_NAME: GTAiOS
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/Engine/NativeWasmtimeHost.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/Wasmtime/include"
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/Wasmtime/libwasmtime.a"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "$(SRCROOT)/Config/Info.plist"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  GTAiOS:
    build:
      targets:
        GTAiOS: all
    run:
      config: Debug
    archive:
      config: Release
