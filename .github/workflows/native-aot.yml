name: Native ARM64 AOT engine conversion
on:
  push:
    branches: [ios-usb-port, native-aot-work]
    paths: ["ios/Scripts/aot_*", ".github/workflows/native-aot.yml"]
  workflow_dispatch:
    inputs:
      private_engine_artifact_run:
        description: "Run ID containing authorized engine-input/game.wasm artifact; no public binary upload"
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-aot:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WebAssembly/wabt
          ref: b835f1ce49e5803c597a0548099456d6be1d3d11
          path: external/wabt
      - name: Build pinned WebAssembly toolchain
        run: |
          cmake -S external/wabt -B "$RUNNER_TEMP/wabt-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON
          cmake --build "$RUNNER_TEMP/wabt-build" --target wasm2c wat2wasm wasm-validate --parallel 4
      - name: Cross-compile memory64+shared memory test to real iPhone ARM64 object
        env:
          WABT_SOURCE_DIR: ${{ github.workspace }}/external/wabt
          WABT_BIN_DIR: ${{ runner.temp }}/wabt-build
        run: |
          cat > "$RUNNER_TEMP/test.wat" <<'WAT'
          (module
            (import "env" "memory" (memory i64 1 2 shared))
            (func (export "add64") (param i64 i64) (result i64)
              local.get 0
              local.get 1
              i64.add)
          )
          WAT
          "$WABT_BIN_DIR/wat2wasm" --enable-all "$RUNNER_TEMP/test.wat" -o "$RUNNER_TEMP/test.wasm"
          bash ios/Scripts/aot_compile.sh "$RUNNER_TEMP/test.wasm" "$RUNNER_TEMP/smoke-aot"
          python3 - "$RUNNER_TEMP/smoke-aot/engine-imports.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          m=next(x for x in j["imports"] if x["kind"]=="memory")
          assert m["limits"]["memory64"] and m["limits"]["shared"]
          assert m["limits"]["initial_pages"] == 1
          print("PASS: tested memory64/shared WASM to arm64 Mach-O conversion")
          PY
      - name: Retrieve optional private engine artifact
        if: github.event_name == 'workflow_dispatch' && inputs.private_engine_artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          name: engine-input
          run-id: ${{ inputs.private_engine_artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/private-engine
      - name: Compile authorized real engine (never publish its contents)
        if: github.event_name == 'workflow_dispatch' && inputs.private_engine_artifact_run != ''
        env:
          WABT_SOURCE_DIR: ${{ github.workspace }}/external/wabt
          WABT_BIN_DIR: ${{ runner.temp }}/wabt-build
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/private-engine/game.wasm"
          python3 ios/Scripts/aot_import_audit.py "$RUNNER_TEMP/private-engine/game.wasm" \
            --expected-sha256 11ca8d2c04c5e843d18ff4aea4899d72c86973c6b031df334e67c446b2ae83e0 \
            --json "$RUNNER_TEMP/engine-abi.json"
          bash ios/Scripts/aot_compile.sh "$RUNNER_TEMP/private-engine/game.wasm" "$RUNNER_TEMP/real-aot"
          echo "Converted machine-code object is unlinked, not a playable game; no public artifact emitted."
