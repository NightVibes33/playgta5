name: Build Linux WASM AOT Audit Tools
on:
  push:
    branches: [native-aot-work]
    paths: [".github/workflows/linux-wabt-audit.yml", "ios/Scripts/patch_wabt_atomics.py", "ios/NativeRuntime/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WebAssembly/wabt
          ref: b835f1ce49e5803c597a0548099456d6be1d3d11
          path: thirdparty/wabt
      - name: Apply portable atomic wait-notify wasm2c patch
        run: python3 ios/Scripts/patch_wabt_atomics.py thirdparty/wabt/src/c-writer.cc
      - name: Compile pinned WABT tools on Linux
        run: |
          cmake -S thirdparty/wabt -B build-wabt -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=OFF -DBUILD_TOOLS=ON
          cmake --build build-wabt --target wasm2c wasm-validate wasm-objdump wat2wasm --parallel 4
          mkdir -p dist/runtime_headers
          cp build-wabt/wasm2c build-wabt/wasm-validate build-wabt/wasm-objdump build-wabt/wat2wasm dist/
          cp thirdparty/wabt/wasm2c/*.h dist/runtime_headers/
          echo "WABT commit b835f1ce49e5803c597a0548099456d6be1d3d11" > dist/BUILD_SOURCE.txt
          file dist/wasm2c
      - name: Verify atomic memory64 WASM code generation and C compile
        run: |
          cat > "$RUNNER_TEMP/atomic.wat" <<'WAT'
          (module
            (import "env" "memory" (memory i64 1 2 shared))
            (func (export "wait32") (param i64 i32 i64) (result i32)
              local.get 0
              local.get 1
              local.get 2
              memory.atomic.wait32)
            (func (export "notify") (param i64 i32) (result i32)
              local.get 0
              local.get 1
              memory.atomic.notify)
          )
          WAT
          build-wabt/wat2wasm --enable-threads "$RUNNER_TEMP/atomic.wat" -o "$RUNNER_TEMP/atomic.wasm"
          build-wabt/wasm2c --enable-threads --no-debug-names -n atomic_test -o "$RUNNER_TEMP/atomic.c" "$RUNNER_TEMP/atomic.wasm"
          clang -std=c11 -pthread -Ithirdparty/wabt/wasm2c -Iios/NativeRuntime -c "$RUNNER_TEMP/atomic.c" -o "$RUNNER_TEMP/atomic.o"
          clang -std=c11 -pthread -Ithirdparty/wabt/wasm2c -Iios/NativeRuntime -c ios/NativeRuntime/gta-native-atomics.c -o "$RUNNER_TEMP/atomics.o"
          grep -Fq 'gta_wasm_atomic_wait32' "$RUNNER_TEMP/atomic.c"
          grep -Fq 'gta_wasm_atomic_notify' "$RUNNER_TEMP/atomic.c"
          echo 'PASS: shared memory64 atomic wait32/notify -> compiled native C objects'
      - uses: actions/upload-artifact@v4
        with:
          name: wabt-linux-debug-audit-tools
          path: dist/
          retention-days: 2
