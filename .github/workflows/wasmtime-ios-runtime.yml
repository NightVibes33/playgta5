name: Native Wasmtime iOS Runtime Library Build
on:
  push:
    branches: [native-aot-work]
    paths: [".github/workflows/wasmtime-ios-runtime.yml"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bytecodealliance/wasmtime
          ref: v49.0.2
          path: thirdparty/wasmtime
      - name: Install Rust iOS target
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
      - name: Build iPhone ARM64 runtime-only Wasmtime C API static library
        run: |
          set -euo pipefail
          cmake -S thirdparty/wasmtime/crates/c-api -B "$RUNNER_TEMP/ios-wasmtime" \
            -DWASMTIME_TARGET=aarch64-apple-ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DWASMTIME_USER_CARGO_BUILD_OPTIONS="--no-default-features;--features;threads"
          cmake --build "$RUNNER_TEMP/ios-wasmtime" --parallel 4
          find thirdparty/wasmtime/target/aarch64-apple-ios/release -name libwasmtime.a -o -name libwasmtime_c_api.a
          file thirdparty/wasmtime/target/aarch64-apple-ios/release/libwasmtime.a
          mkdir -p dist
          cp thirdparty/wasmtime/target/aarch64-apple-ios/release/libwasmtime.a dist/
          du -h dist/libwasmtime.a
      - uses: actions/upload-artifact@v4
        with:
          name: wasmtime-ios-arm64-runtime-static
          path: dist/libwasmtime.a
          retention-days: 2
