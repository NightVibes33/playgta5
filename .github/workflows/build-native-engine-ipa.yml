name: Build GTAiOS Native Engine IPA
on:
  push:
    branches: [ios-usb-port]
    paths: ['native/**', '.gitmodules', '.github/workflows/build-native-engine-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-native-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-engine:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fetch exact private engine input with read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: NightVibes33/playgta5-engine-input
          ref: bd66a8262ecbc19aaa7bedcc11432332ba1301e1
          ssh-key: ${{ secrets.MUGUET_ENGINE_DEPLOY_KEY }}
          path: .engine-input
          persist-credentials: false
      - name: Verify source engine and apply external-folder adapter
        run: |
          set -euo pipefail
          echo '11ca8d2c04c5e843d18ff4aea4899d72c86973c6b031df334e67c446b2ae83e0  .engine-input/game.wasm' | shasum -a 256 -c -
          python3 native/prepare_muguet.py
          xcodebuild -version
      - name: Install pinned Rust and XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/Muguet/target/release
            native/Muguet/target/ios
          key: muguet-ios-${{ runner.arch }}-rust1981-${{ hashFiles('native/Muguet/Cargo.lock', 'native/prepare_muguet.py', 'native/ExternalImporter.swift') }}
          restore-keys: muguet-ios-${{ runner.arch }}-rust1981-
      - name: Compile real engine and native Metal runtime
        env:
          BUNDLE_ID: com.nightvibes33.gtaios.native
          MUGUET_IOS_HEAP_GB: '5'
        run: |
          set -euo pipefail
          cd native/Muguet
          ./make-ios.sh "$GITHUB_WORKSPACE/.engine-input/game.wasm" --ipa 2>&1 | tee "$RUNNER_TEMP/native-engine-build.log"
      - name: Verify signed code and external-only game assets
        run: |
          set -euo pipefail
          python3 native/verify_external_assets.py --ipa native/Muguet/build/Muguet.ipa
          xcrun otool -l native/Muguet/target/ios-xcode/Build/Products/Release-iphoneos/Muguet.app/muguet > "$RUNNER_TEMP/native-engine-mach-o.txt"
          grep -q '__GAME' "$RUNNER_TEMP/native-engine-mach-o.txt"
          cp native/Muguet/build/Muguet.ipa GTAiOS-Native.ipa
          shasum -a 256 GTAiOS-Native.ipa > GTAiOS-Native.sha256
      - name: Upload native engine IPA
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-Native-engine-IPA
          path: |
            GTAiOS-Native.ipa
            GTAiOS-Native.sha256
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-Native-build-diagnostics
          path: |
            ${{ runner.temp }}/native-engine-build.log
            ${{ runner.temp }}/native-engine-mach-o.txt
          if-no-files-found: ignore
