name: Build GTAiOS Unsigned IPA
on:
  push:
    branches: [ios-usb-port, native-aot-work, native-manifest-bridge]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned Wasmtime iOS static runtime (rebuild on artifact expiry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasmtime-artifact" ios/Vendor/Wasmtime/include
          LATEST=$(gh run list -R "$GITHUB_REPOSITORY" -w ios-wasmtime-host.yml \
            --branch ios-usb-port --limit 30 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')
          if [ -n "$LATEST" ] && gh run download "$LATEST" -R "$GITHUB_REPOSITORY" \
               -n ios-wasmtime49-threads-runtime-arm64 \
               -D "$RUNNER_TEMP/wasmtime-artifact"; then
            cp "$RUNNER_TEMP/wasmtime-artifact/wasmtime/target/aarch64-apple-ios/release/libwasmtime.a" ios/Vendor/Wasmtime/
            cp -R "$RUNNER_TEMP/wasmtime-artifact/wasmtime/crates/c-api/include/." ios/Vendor/Wasmtime/include/
          else
            echo 'No cached Wasmtime runtime artifact available; compiling pinned source.'
            git clone --depth 1 --branch v49.0.2 https://github.com/bytecodealliance/wasmtime.git "$RUNNER_TEMP/wasmtime-source"
            rustup target add aarch64-apple-ios
            (cd "$RUNNER_TEMP/wasmtime-source" && cargo build --locked --release -p wasmtime-c-api \
              --target aarch64-apple-ios --no-default-features --features threads)
            cp "$RUNNER_TEMP/wasmtime-source/target/aarch64-apple-ios/release/libwasmtime.a" ios/Vendor/Wasmtime/
            cp -R "$RUNNER_TEMP/wasmtime-source/crates/c-api/include/." ios/Vendor/Wasmtime/include/
          fi
          # Reproduce Wasmtime's v49.0.2 generated C header verbatim from
          # the checked-out C API conf.h.in; match threads-only static Cargo.
          test -s ios/Vendor/Wasmtime/include/wasmtime/conf.h.in
          python3 ios/Scripts/generate_wasmtime_conf.py \
            ios/Vendor/Wasmtime/include/wasmtime/conf.h.in \
            ios/Vendor/Wasmtime/include/wasmtime/conf.h
          grep -Fq '#define WASMTIME_FEATURE_THREADS 1' ios/Vendor/Wasmtime/include/wasmtime/conf.h
          if grep -Eq '^#define WASMTIME_FEATURE_(CRANELIFT|WINCH|WASI|GC|COMPONENT_MODEL)' ios/Vendor/Wasmtime/include/wasmtime/conf.h; then
            echo 'ERROR: C API header has unsupported non-thread features' >&2
            exit 1
          fi
          test -s ios/Vendor/Wasmtime/libwasmtime.a
          test -s ios/Vendor/Wasmtime/include/wasm.h
          test -s ios/Vendor/Wasmtime/include/wasmtime/conf.h
          echo 'Wasmtime iPhone static host + C API ready; no GTA game code in IPA.'
      - name: Verify verified native WASM keyboard/mouse input ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            ios/Sources/Input/NativeGameInputABI.c \
            ios/Tests/native-input-abi.test.c -lm -lpthread \
            -o "$RUNNER_TEMP/native-input-abi-test"
          "$RUNNER_TEMP/native-input-abi-test"
      - name: Verify native HTTPFS manifest import semantics
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pthread \
            ios/Sources/Engine/NativeHTTPFSManifestABI.c \
            ios/Tests/native-httpfs-manifest.test.c \
            -o "$RUNNER_TEMP/native-httpfs-manifest"
          "$RUNNER_TEMP/native-httpfs-manifest"
      - name: Compile signed-device ARM64 AOT execution smoke fixture
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-aarch64-macos.tar.xz \
            -o "$RUNNER_TEMP/wasmtime-cli.tar.xz"
          mkdir -p "$RUNNER_TEMP/wasmtime-bin"
          tar -xJf "$RUNNER_TEMP/wasmtime-cli.tar.xz" -C "$RUNNER_TEMP/wasmtime-bin"
          WASMTIME=$(find "$RUNNER_TEMP/wasmtime-bin" -type f -name wasmtime | head -1)
          test -n "$WASMTIME"
          chmod +x "$WASMTIME"
          "$WASMTIME" --version
          # Small original WASM module: export add(i32,i32) -> i32.
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ["RUNNER_TEMP"], "native-smoke.wasm").write_bytes(
              bytes.fromhex("0061736d0100000001070160027f7f017f030201000707010361646400000a09010700200020016a0b"))
          PY
          "$WASMTIME" compile --target aarch64-apple-ios -O opt-level=0 \
            -C parallel-compilation=n \
            -o ios/Sources/Resources/native-aot-smoke.cwasm \
            "$RUNNER_TEMP/native-smoke.wasm"
          file ios/Sources/Resources/native-aot-smoke.cwasm
          test -s ios/Sources/Resources/native-aot-smoke.cwasm
          # Real shared memory64/threads AOT fixture. It imports env.memory,
          # writes and reads 42 at a 64-bit guest address, and allows the
          # app to verify host/guest memory coherence on device. One page
          # only: NEVER allocate GTA's 3 GiB heap for this smoke test.
          cat > "$RUNNER_TEMP/native-memory64-smoke.wat" <<'WAT'
          (module
            (import "env" "memory" (memory i64 1 2 shared))
            (func (export "touch") (param i64) (result i32)
              local.get 0
              i32.const 42
              i32.store
              local.get 0
              i32.load)
            ;; Device test reads the actual 444-byte keyboard/mouse input
            ;; block populated by NativeGameInputABI.c. Not GTA gameplay.
            (func (export "input_w") (param i64) (result i32)
              local.get 0
              i32.load8_u))
          WAT
          "$WASMTIME" compile --target aarch64-apple-ios -O opt-level=0 \
            -C parallel-compilation=n \
            -o ios/Sources/Resources/native-memory64-smoke.cwasm \
            "$RUNNER_TEMP/native-memory64-smoke.wat"
          test -s ios/Sources/Resources/native-memory64-smoke.cwasm
          file ios/Sources/Resources/native-memory64-smoke.cwasm
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify native Metal and USB architecture
        run: python3 ios/Scripts/verify_native_runtime.py
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Compile iPhone arm64 app without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/GTAiOS.xcodeproj -scheme GTAiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build unsigned SideStore IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GTAiOS.app" Payload/GTAiOS.app
          zip -qry GTAiOS-unsigned.ipa Payload
          bash ios/Scripts/check_ipa.sh GTAiOS-unsigned.ipa
      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-unsigned-and-logs
          path: |
            GTAiOS-unsigned.ipa
            ${{ runner.temp }}/build.log
          if-no-files-found: warn

  ui-smoke:
    name: iPhone simulator UI snapshot
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare runtime and project
        run: |
          python3 ios/Scripts/verify_native_runtime.py
          xcodegen generate --spec ios/project.yml --project ios
      - name: Find available iPhone simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; r=json.load(sys.stdin)["devices"]; v=[d for group in r.values() for d in group if "iPhone" in d["name"] and d["state"] != "unavailable"]; v.sort(key=lambda x: (x["name"] != "iPhone 16", x["name"])); print(v[0]["udid"] if v else "")')
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator installed on this runner"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
            echo "Testing simulator $DEVICE"
          fi
      - name: Compile and capture launch screen
        if: steps.simulator.outputs.available == 'true'
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild -project ios/GTAiOS.xcodeproj -scheme GTAiOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimDerived" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/simulator-build.log" 2>&1
          xcrun simctl install "$UDID" "$RUNNER_TEMP/SimDerived/Build/Products/Debug-iphonesimulator/GTAiOS.app"
          xcrun simctl launch "$UDID" com.nightvibes33.gtaios
          sleep 6
          xcrun simctl io "$UDID" screenshot iphone-launcher.png
          test -s iphone-launcher.png
      - name: Upload visual smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTAiOS-iphone-simulator-screenshot
          path: |
            iphone-launcher.png
            ${{ runner.temp }}/simulator-build.log
          if-no-files-found: warn
